name: Generate Activity Graph

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate activity SVG
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
        run: |
          mkdir -p profile

          python3 <<'PY'
          import os
          import json
          import urllib.request
          from datetime import datetime, timedelta

          username = os.environ["USERNAME"]
          token = os.environ["GH_TOKEN"]

          query = """
          query($login:String!, $from:DateTime!, $to:DateTime!) {
            user(login:$login) {
              contributionsCollection(from:$from,to:$to) {
                contributionCalendar {
                  weeks {
                    contributionDays {
                      date
                      contributionCount
                    }
                  }
                }
              }
            }
          }
          """

          to_date = datetime.utcnow()
          from_date = to_date - timedelta(days=365)

          payload = json.dumps({
              "query": query,
              "variables": {
                  "login": username,
                  "from": from_date.isoformat() + "Z",
                  "to": to_date.isoformat() + "Z"
              }
          }).encode()

          request = urllib.request.Request(
              "https://api.github.com/graphql",
              data=payload,
              headers={
                  "Authorization": f"Bearer {token}",
                  "Content-Type": "application/json"
              }
          )

          with urllib.request.urlopen(request) as response:
              data = json.load(response)

          weeks = data["data"]["user"]["contributionsCollection"]["contributionCalendar"]["weeks"]

          values = []

          for week in weeks:
              for day in week["contributionDays"]:
                  values.append(day["contributionCount"])

          width = 1000
          height = 300
          padding = 45

          max_value = max(values) if values else 1

          points = []

          for i, value in enumerate(values):
              x = padding + i * ((width - padding * 2) / max(len(values) - 1, 1))
              y = height - padding - (value / max_value) * (height - padding * 2)
              points.append(f"{x:.1f},{y:.1f}")

          polyline = " ".join(points)

          svg = f'''<svg xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 {width} {height}"
          width="{width}"
          height="{height}">

          <rect width="100%" height="100%" fill="#0d1117" rx="16"/>

          <text x="{padding}" y="32"
                fill="#c9d1d9"
                font-family="Arial, sans-serif"
                font-size="18"
                font-weight="bold">
            Contribution Activity — {username}
          </text>

          <line
            x1="{padding}"
            y1="{height-padding}"
            x2="{width-padding}"
            y2="{height-padding}"
            stroke="#30363d"/>

          <polyline
            points="{polyline}"
            fill="none"
            stroke="#58a6ff"
            stroke-width="3"
            stroke-linejoin="round"
            stroke-linecap="round"/>

          <polyline
            points="{polyline} {width-padding},{height-padding} {padding},{height-padding}"
            fill="#58a6ff"
            opacity="0.12"/>

          </svg>'''

          with open("profile/activity.svg", "w") as file:
              file.write(svg)

          print("Activity graph generated successfully.")
          PY

      - name: Commit activity graph
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"

          git add profile/activity.svg

          git commit -m "Update activity graph" || exit 0

          git push